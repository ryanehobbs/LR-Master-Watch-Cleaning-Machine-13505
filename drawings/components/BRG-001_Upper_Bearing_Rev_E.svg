<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
    <defs>
        <style>
            .header-text { font-family: sans-serif; font-weight: bold; font-size: 16px; fill: #111; text-anchor: middle; letter-spacing: 1px; }
            .label-text { font-family: sans-serif; font-weight: bold; font-size: 10px; fill: #333; }
            .value-text { font-family: monospace; font-size: 12px; fill: #111; }
            .notes-text { font-family: sans-serif; font-size: 10px; fill: #111; }
            .grid-label { font-family: sans-serif; font-weight: bold; font-size: 10px; fill: #666; text-anchor: middle; }
            .disclaimer-text { font-family: sans-serif; font-style: italic; font-size: 9px; fill: #666; text-anchor: middle; }
        </style>
        
        <pattern id="bronzeHatch" width="15" height="15" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <line x1="0" y1="0" x2="0" y2="15" stroke="#475569" stroke-width="1" opacity="0.3" />
            <line x1="0" y1="0" x2="15" y2="0" stroke="#475569" stroke-width="1" opacity="0.3" />
        </pattern>
        
        <marker id="arr-l" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 10 0 L 0 5 L 10 10 z" fill="#0369a1"/>
        </marker>
        <marker id="arr-r" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#0369a1"/>
        </marker>
    </defs>

    <rect width="1200" height="800" fill="#f8f9fa" />

    <rect x="15" y="15" width="1170" height="770" fill="none" stroke="#111" stroke-width="1" />
    <rect x="35" y="35" width="1130" height="730" fill="none" stroke="#111" stroke-width="2" />

    <line x1="320" y1="15" x2="320" y2="35" stroke="#111" stroke-width="1" />
    <line x1="600" y1="15" x2="600" y2="35" stroke="#111" stroke-width="1" />
    <line x1="880" y1="15" x2="880" y2="35" stroke="#111" stroke-width="1" />
    <text x="177" y="28" class="grid-label">A</text>
    <text x="460" y="28" class="grid-label">B</text>
    <text x="740" y="28" class="grid-label">C</text>
    <text x="1020" y="28" class="grid-label">D</text>

    <line x1="15" y1="230" x2="35" y2="230" stroke="#111" stroke-width="1" />
    <line x1="15" y1="425" x2="35" y2="425" stroke="#111" stroke-width="1" />
    <line x1="15" y1="620" x2="35" y2="620" stroke="#111" stroke-width="1" />
    <text x="25" y="137" class="grid-label">1</text>
    <text x="25" y="332" class="grid-label">2</text>
    <text x="25" y="527" class="grid-label">3</text>

    <line x1="1165" y1="230" x2="1185" y2="230" stroke="#111" stroke-width="1" />
    <line x1="1165" y1="425" x2="1185" y2="425" stroke="#111" stroke-width="1" />
    <line x1="1165" y1="620" x2="1185" y2="620" stroke="#111" stroke-width="1" />

    <line x1="320" y1="765" x2="320" y2="785" stroke="#111" stroke-width="1" />
    <line x1="600" y1="765" x2="600" y2="785" stroke="#111" stroke-width="1" />
    <line x1="880" y1="765" x2="880" y2="785" stroke="#111" stroke-width="1" />

    <line x1="600" y1="35" x2="600" y2="620" stroke="#ccc" stroke-width="1" stroke-dasharray="15,5,5,5" />
    <line x1="35" y1="327" x2="1165" y2="327" stroke="#ccc" stroke-width="1" stroke-dasharray="15,5,5,5" />

    <g transform="translate(194, 73)">
        <g stroke="#94a3b8" stroke-width="1" stroke-dasharray="12,4,2,4">
            <line x1="270" y1="80" x2="270" y2="420" />
            <line x1="570" y1="80" x2="570" y2="420" />
            <line x1="100" y1="250" x2="720" y2="250" />
        </g>

        <g id="front-elevation">
            <line x1="220" y1="116" x2="220" y2="384" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,4" />
            <line x1="320" y1="116" x2="320" y2="384" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,4" />
            <path d="M 188,116 L 352,116 L 352,173.7 A 112,112 0 0,1 352,326.3 L 352,384 L 188,384 L 188,326.3 A 112,112 0 0,1 188,173.7 Z" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
    
            <text x="270" y="445" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">FRONT ELEVATION</text>
        </g>

        <g id="cross-section">
            <path d="M 488,116 L 520,116 L 520,384 L 488,384 L 488,326.3 A 112,112 0 0,1 488,173.7 Z" fill="url(#bronzeHatch)" stroke="#0f172a" stroke-width="2" />
            <path d="M 620,116 L 652,116 L 652,173.7 A 112,112 0 0,1 652,326.3 L 652,384 L 620,384 Z" fill="url(#bronzeHatch)" stroke="#0f172a" stroke-width="2" />
   
            <line x1="520" y1="116" x2="520" y2="384" stroke="#0f172a" stroke-width="2" />
            <line x1="620" y1="116" x2="620" y2="384" stroke="#0f172a" stroke-width="2" />
            <text x="570" y="445" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">CROSS SECTIONAL PROFILE</text>
        </g>

        <g id="dimensions" stroke="#0369a1" stroke-width="1" fill="#0369a1" font-family="monospace" font-size="11">
            <line x1="135" y1="116" x2="174" y2="116" stroke="#94a3b8" stroke-width="1"/>
    
            <line x1="135" y1="384" x2="174" y2="384" stroke="#94a3b8" stroke-width="1"/>
            <line x1="140" y1="126" x2="140" y2="374" marker-start="url(#arr-l)" marker-end="url(#arr-r)"/>
            <text x="130" y="254" text-anchor="end" font-weight="bold">0.670" (CONFIRMED)</text>

            <line x1="188" y1="96" x2="188" y2="112" stroke="#94a3b8" stroke-width="1"/>
            <line x1="352" y1="96" x2="352" y2="112" stroke="#94a3b8" stroke-width="1"/>
            <line x1="198" y1="101" x2="342" y2="101" marker-start="url(#arr-l)" marker-end="url(#arr-r)"/>
            <text x="270" y="93" text-anchor="middle" font-weight="bold">Ø0.410" (CONFIRMED)</text>

            <line x1="520" y1="96" x2="520" y2="112" stroke="#94a3b8" stroke-width="1"/>
            <line x1="620" y1="96" x2="620" y2="112" stroke="#94a3b8" stroke-width="1"/>
            <line x1="530" y1="101" x2="610" y2="101" marker-start="url(#arr-l)" marker-end="url(#arr-r)"/>
            <text x="570" y="93" text-anchor="middle" font-weight="bold">Ø0.250" (CONFIRMED)</text>

            <line x1="458" y1="250" x2="480" y2="250" stroke="#94a3b8" stroke-width="1"/>
            <line x1="660" y1="250" x2="682" y2="250" stroke="#94a3b8" stroke-width="1"/>
            <line x1="468" y1="250" x2="672" y2="250" marker-start="url(#arr-l)" marker-end="url(#arr-r)"/>
            <text x="570" y="241" text-anchor="middle" font-weight="bold">Ø0.560" (CONFIRMED)</text>

            <line x1="188" y1="388" x2="188" y2="404" stroke="#94a3b8" stroke-width="1"/>
            <line x1="352" y1="388" x2="352" y2="404" stroke="#94a3b8" stroke-width="1"/>
            <line x1="198" y1="399" x2="342" y2="399" marker-start="url(#arr-l)" marker-end="url(#arr-r)"/>
            <text x="270" y="415" text-anchor="middle" font-weight="bold">Ø0.410" (CONFIRMED)</text>
        </g>

        <g font-family="sans-serif" font-size="10" font-weight="bold">
            <line x1="350" y1="130" x2="400" y2="130" stroke="#475569" stroke-width="1"/>
 
            <circle cx="350" cy="130" r="2.5" fill="#0f172a"/>
            <text x="405" y="133" fill="#475569">BRG-005 (TOP COLLAR)</text>

            <line x1="362" y1="230" x2="400" y2="210" stroke="#475569" stroke-width="1"/>
            <circle cx="362" cy="230" r="2.5" fill="#0f172a"/>
            <text x="405" y="213" fill="#475569">BRG-003 (SPHERICAL BALL)</text>

            <line x1="520" y1="200" x2="440" y2="180" 
stroke="#475569" stroke-width="1"/>
            <circle cx="520" cy="200" r="2.5" fill="#0f172a"/>
            <text x="435" y="176" fill="#475569" text-anchor="end">BRG-004 (CENTER BORE)</text>

            <line x1="350" y1="370" x2="400" y2="370" stroke="#475569" stroke-width="1"/>
            <circle cx="350" cy="370" r="2.5" fill="#0f172a"/>
            <text x="405" y="373" fill="#475569">BRG-006 (BOTTOM COLLAR)</text>
        </g>
    </g>

  
    <line x1="35" y1="620" x2="1165" y2="620" stroke="#111" stroke-width="2" />
    
    <rect x="45" y="630" width="530" height="120" fill="#fff" stroke="#111" stroke-width="2" />
    <text x="55" y="648" class="label-text">NOTES &amp;
SPECIFICATIONS:</text>
    <text x="55" y="665" class="notes-text">1. MATERIAL: Sintered Bronze / Self-lubricating porous alloy.</text>
    <text x="55" y="680" class="notes-text">2.
GEOMETRY: Spherical ball (Ø0.560") seats in upper housing socket (0.750" bore).</text>
    <text x="55" y="695" class="notes-text">3.
ALIGNMENT: Ball-and-socket design allows self-alignment of the armature shaft.</text>
    <text x="55" y="710" class="notes-text">4.
BORE: Ø0.250" precision fit for the upper armature journal.</text>
    <text x="55" y="725" class="notes-text">5. COLLARS: Top and bottom collars (Ø0.410") retain the felt oil washers.</text>
    <text x="55" y="740" class="notes-text">6.
METROLOGY ANCHOR: Dimensional properties synced directly with reference specimen S/N 13505.</text>

    <rect x="585" y="630" width="570" height="120" fill="#fff" stroke="#111" stroke-width="2" />
    
    <line x1="585" y1="660" x2="1155" y2="660" stroke="#111" stroke-width="2" />
    <line x1="585" y1="705" x2="1155" y2="705" stroke="#111" stroke-width="1" />
    
    <line x1="755" y1="660" x2="755" y2="750" stroke="#111" stroke-width="1" />
    <line x1="965" y1="660" x2="965" y2="750" stroke="#111" stroke-width="1" />
    <line x1="1065" y1="705" x2="1065" y2="750" stroke="#111" stroke-width="1" />

    <text x="870" y="650" class="header-text">L&amp;R PRECISION CLEANING MACHINE — MASTER</text>
 
    
    <text x="595" y="675" class="label-text">MANUFACTURER:</text>
    <text x="595" y="695" class="value-text" font-weight="bold">L&amp;R MFG.
CO.</text>
    
    <text x="765" y="675" class="label-text">DRAWING TITLE:</text>
    <text x="765" y="695" class="value-text" font-weight="bold" font-size="10px" textLength="185" lengthAdjust="spacingAndGlyphs">UPPER BEARING COMPONENT SHEET (REV E)</text>
    
    <text x="975" y="675" class="label-text">PART NUMBER / ID:</text>
    <text x="975" y="695" class="value-text" font-weight="bold" fill="#ff3333">BRG-001</text>

    <text x="595" y="720" class="label-text">ENGINEER:</text>
    <text x="595" y="740" class="value-text">Hobbs R.E.</text>
    
    <text x="765" y="720" class="label-text">METADATA CONTROL:</text>
    <text x="765" y="735" class="value-text" font-size="10px">SCALE: 1:1 TRUE SCALE</text>
    <text x="765" y="748" class="value-text" font-size="10px">SERIAL NUMBER: S/N 13505</text>
   
  
    <text x="975" y="720" class="label-text">DATE:</text>
    <text x="975" y="740" class="value-text">June 12, 2026</text>
    
    <text x="1075" y="720" class="label-text">STATUS:</text>
    <text x="1075" y="740" class="value-text" font-weight="bold">RELEASED</text>

    <text x="600" y="760" class="disclaimer-text">REPRODUCTION DOCUMENT — Not an original L&amp;R Mfg. Co. technical publication.
Reverse-engineered from direct physical measurement of specimen S/N 13505. Curated by Hobbs R.E., 2026. For restoration reference only.</text>
