    <text x="55" y="648" class="label-text">NOTES &amp; SPECIFICATIONS:</text>
    <text x="55" y="665" class="notes-text">1. MATERIAL: Cast Aluminum Alloy / Smooth organic bell dome taper geometry.</text>
    <text x="55" y="680" class="notes-text">2. DIMENSIONS: 3.200" OD, 2.650" Overall Height, 1.850" Interior Depth.</text>
    <text x="55" y="695" class="notes-text">3. WIRE ENTRY (UH-002): 0.950"W x 0.700"H slot, placed 0.500" above bottom flange.</text>
    <text x="55" y="710" class="notes-text">4. BRUSH PORTS (UH-003): Ø0.435" ID / Ø0.530" OD ports at 180° axis.</text>
    <text x="55" y="725" class="notes-text">5. MOUNTING: 2x Mount screws (UH-006) on 2.300" bolt circle.</text>
    <text x="55" y="740" class="notes-text">6. METROLOGY ANCHOR: Dimensional properties synced directly with reference specimen S/N 13505.</text>

