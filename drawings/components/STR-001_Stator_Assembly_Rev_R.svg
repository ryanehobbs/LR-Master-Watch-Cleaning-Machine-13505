<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
    <defs>
        <style>
            .header-text { font-family: sans-serif; font-weight: bold; font-size: 16px; fill: #111; text-anchor: middle; letter-spacing: 1px; }
            .label-text { font-family: sans-serif; font-weight: bold; font-size: 10px; fill: #333; }
            .value-text { font-family: monospace; font-size: 12px; fill: #111; }
            .notes-text { font-family: sans-serif; font-size: 10px; fill: #111; }
            .grid-label { font-family: sans-serif; font-weight: bold; font-size: 10px; fill: #666; text-anchor: middle; }
            .disclaimer-text { font-family: sans-serif; font-style: italic; font-size: 9px; fill: #666; text-anchor: middle; }
        </style>

        <marker id="arr-up" markerWidth="10" markerHeight="10" refX="5" refY="0" orient="auto">
            <path d="M0,10 L5,0 L10,10 Z" fill="#111" />
        </marker>
        <marker id="arr-dn" markerWidth="10" markerHeight="10" refX="5" refY="10" orient="auto">
            <path d="M0,0 L5,10 L10,0 Z" fill="#111" />
        </marker>
    
        <marker id="arr-l" markerWidth="10" markerHeight="10" refX="0" refY="5" orient="auto">
