    <line x1="35" y1="620" x2="1165" y2="620" stroke="#111" stroke-width="2" />
    
    <rect x="45" y="630" width="530" height="120" fill="#fff" stroke="#111" stroke-width="2" />
    <text x="55" y="648" class="label-text">NOTES &amp;
SPECIFICATIONS:</text>
    <text x="55" y="665" class="notes-text">1. MATERIAL: Laminated electrical steel core (0.736" stack), cloth-wound copper coils.</text>
    <text x="55" y="680" class="notes-text">2. YOKE GEOMETRY: 3.000" OD unified core features aggressive concave inward side waists.</text>
    <text x="55" y="695" class="notes-text">3.
COILS (STR-004/005): Long crescents shifted inward to tightly hug 0.045" pole shoes.</text>
    <text x="55" y="710" class="notes-text">4. MOUNTING: Four points on 2.300" bolt circle;
2 pass-through, 2 threaded (STR-008).</text>
    <text x="55" y="725" class="notes-text">5.
CLEARANCE: Air gap to armature core derived at ~0.020" from center axis.</text>
    <text x="55" y="740" class="notes-text">6. METROLOGY ANCHOR: Dimensional properties synced directly with reference specimen S/N 13505.</text>

