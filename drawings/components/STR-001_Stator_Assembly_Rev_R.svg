        </pattern>
        <pattern id="hatch-shoe" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)">
            <line x1="0" y1="0" x2="0" y2="5" stroke="#333" stroke-width="1" />
        </pattern>
        <pattern id="crosshatch-coil" patternUnits="userSpaceOnUse" width="8" height="8">
            <path d="M0,0 L8,8 M8,0 L0,8" stroke="#666" stroke-width="1" />
        </pattern>
    </defs>

 
