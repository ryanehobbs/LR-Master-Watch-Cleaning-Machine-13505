<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Consolas, monospace">
  <!-- REPRODUCTION DOCUMENT. Verified as found control unit electrical schematic. Rev A first issue. -->
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#111"/>
    </marker>
  </defs>
  <style>
    .wire{stroke:#111;stroke-width:2.2;fill:none}
    .comp{stroke:#111;stroke-width:2.2;fill:none}
    .node{fill:#111}
    .lbl{font-size:15px;fill:#111}
    .sm{font-size:12px;fill:#333}
    .id{font-size:14px;font-weight:bold;fill:#111}
    .hd{font-size:22px;font-weight:bold;fill:#111;letter-spacing:1px}
    .box{stroke:#111;stroke-width:1.6;fill:none}
    .red{fill:#b00;font-weight:bold}
  </style>

  <rect x="14" y="14" width="1172" height="792" class="box"/>
  <rect x="14" y="14" width="1172" height="46" class="box" fill="#f0f0f0"/>
  <text x="30" y="44" class="hd">L&amp;R PRECISION CLEANING MACHINE  —  CONTROL UNIT  —  VERIFIED AS-FOUND ELECTRICAL SCHEMATIC</text>
  <text x="1066" y="44" class="id">LR-ELEC-002  Rev A</text>

  <!-- ===================== RAILS ===================== -->
  <line x1="120" y1="130" x2="1050" y2="130" class="wire"/>
  <line x1="120" y1="560" x2="1050" y2="560" class="wire"/>
  <text x="126" y="120" class="id">N2  HOT (Line)</text>
  <text x="126" y="582" class="id">N1  NEUTRAL</text>

  <!-- ===================== P1 AC INLET ===================== -->
  <rect x="40" y="300" width="60" height="90" class="box"/>
  <text x="46" y="332" class="sm">P1</text>
  <text x="44" y="352" class="sm">CTL-008</text>
  <text x="44" y="372" class="sm">2-wire</text>
  <line x1="100" y1="320" x2="120" y2="320" class="wire"/>
  <line x1="120" y1="320" x2="120" y2="130" class="wire"/>
  <text x="104" y="314" class="sm">L (blk)</text>
  <line x1="100" y1="370" x2="120" y2="370" class="wire"/>
  <line x1="120" y1="370" x2="120" y2="560" class="wire"/>
  <text x="104" y="392" class="sm">N (wht)</text>

  <!-- ===================== HEATER + LAMP BRANCH (R1 || DS1) then S2 ===================== -->
  <!-- R1 heater zigzag, HOT to N3 -->
  <line x1="330" y1="130" x2="330" y2="160" class="wire"/>
  <polyline class="comp" points="330,160 330,176 348,186 312,206 348,226 312,246 330,256 330,272"/>
  <line x1="330" y1="272" x2="330" y2="300" class="wire"/>
  <text x="346" y="200" class="id">R1</text>
  <text x="346" y="218" class="sm">CTL-007 HEATER</text>
  <text x="346" y="234" class="sm">220 Ohm OHMITE</text>
  <text x="346" y="250" class="sm">P/N 33974 ~65W</text>

  <!-- DS1 lamp, HOT to N3 -->
  <line x1="470" y1="130" x2="470" y2="186" class="wire"/>
  <circle cx="470" cy="210" r="24" class="comp"/>
  <line x1="453" y1="193" x2="487" y2="227" class="comp"/>
  <line x1="487" y1="193" x2="453" y2="227" class="comp"/>
  <line x1="470" y1="234" x2="470" y2="300" class="wire"/>
  <text x="496" y="200" class="id">DS1</text>
  <text x="496" y="218" class="sm">CTL-005 PILOT</text>
  <text x="496" y="234" class="sm">120V 6W (non-orig)</text>

  <!-- N3 bus -->
  <line x1="330" y1="300" x2="470" y2="300" class="wire"/>
  <circle cx="330" cy="300" r="3.5" class="node"/>
  <circle cx="470" cy="300" r="3.5" class="node"/>
  <text x="356" y="320" class="id">N3</text>

  <!-- S2 toggle from N3 to neutral -->
  <line x1="400" y1="300" x2="400" y2="420" class="wire"/>
  <circle cx="400" cy="420" r="3.5" class="node"/>
  <line x1="400" y1="420" x2="424" y2="470" class="comp"/>
  <circle cx="400" cy="490" r="3.5" class="node"/>
  <line x1="400" y1="490" x2="400" y2="560" class="wire"/>
  <text x="416" y="450" class="id">S2</text>
  <text x="416" y="468" class="sm">CTL-004 HEATER SW</text>
  <text x="416" y="484" class="sm">Arrow H&amp;H 3A 250V</text>

  <text x="250" y="350" class="sm">[ R1 and DS1 are in PARALLEL across N2 to N3;</text>
  <text x="250" y="366" class="sm">  S2 switches the pair to neutral = heater+pilot ON ]</text>

  <!-- ===================== MOTOR BRANCH: S1 plunger, M1, RV1 ===================== -->
  <!-- hot feed to plunger -->
  <line x1="690" y1="130" x2="690" y2="180" class="wire"/>

  <!-- S1 plunger box (transfer switch) -->
  <rect x="600" y="180" width="190" height="120" class="box"/>
  <text x="610" y="172" class="id">S1  PLUNGER (CTL-003)  Arrow H&amp;H Type 3392 1A 125V</text>
  <!-- common d/b (hot) -->
  <circle cx="690" cy="180" r="3.5" class="node"/>
  <text x="700" y="176" class="sm">d/b common (HOT, red braid jumper)</text>
  <!-- wiper from common to throw a (forward, default OUT) -->
  <line x1="690" y1="186" x2="640" y2="294" class="comp"/>
  <!-- throws -->
  <circle cx="640" cy="300" r="3.5" class="node"/>
  <text x="600" y="318" class="sm">a = WHITE</text>
  <circle cx="740" cy="300" r="3.5" class="node"/>
  <text x="712" y="318" class="sm">c = BLACK</text>
  <text x="608" y="228" class="sm">OUT (default) = wiper on a = FORWARD</text>
  <text x="608" y="246" class="sm">IN (pressed)  = wiper on c = REVERSE</text>
  <text x="608" y="264" class="sm">(transfer: hot to one field lead)</text>

  <!-- a (white) to motor S1 ; c (black) to motor S2 -->
  <line x1="640" y1="300" x2="640" y2="350" class="wire"/>
  <line x1="640" y1="350" x2="662" y2="350" class="wire"/>
  <line x1="740" y1="300" x2="740" y2="350" class="wire"/>
  <line x1="740" y1="350" x2="718" y2="350" class="wire"/>

  <!-- M1 motor -->
  <circle cx="690" cy="410" r="60" class="comp"/>
  <text x="672" y="404" class="id">M1</text>
  <text x="650" y="424" class="sm">universal</text>
  <text x="652" y="438" class="sm">series</text>
  <text x="640" y="360" class="sm">S1 wht (N4 fwd)</text>
  <text x="720" y="360" class="sm">S2 blk (N6 rev)</text>
  <line x1="662" y1="350" x2="668" y2="356" class="wire"/>
  <line x1="718" y1="350" x2="712" y2="356" class="wire"/>
  <!-- internal tap note -->
  <text x="612" y="470" class="sm">A2 = field centre-tap to 2nd brush (internal)</text>
  <!-- green brush A1 out to RV1 -->
  <line x1="750" y1="410" x2="900" y2="410" class="wire"/>
  <text x="772" y="402" class="sm">A1 green brush  (N5)</text>

  <!-- RV1 rheostat: green to neutral -->
  <line x1="900" y1="410" x2="900" y2="430" class="wire"/>
  <polyline class="comp" points="900,430 900,444 918,454 882,474 918,494 882,514 900,524 900,536"/>
  <line x1="900" y1="536" x2="900" y2="560" class="wire"/>
  <line x1="940" y1="540" x2="884" y2="452" class="comp" marker-end="url(#arr)"/>
  <text x="916" y="470" class="id">RV1</text>
  <text x="916" y="488" class="sm">CTL-001 SPEED+OFF</text>
  <text x="916" y="504" class="sm">425 Ohm IRC</text>
  <text x="916" y="520" class="sm">full CCW = OFF (open)</text>
  <circle cx="900" cy="560" r="3.5" class="node"/>

  <!-- node tags -->
  <text x="640" y="338" class="id">N4</text>
  <text x="744" y="338" class="id">N6</text>

  <!-- ===================== NOTES BLOCK ===================== -->
  <rect x="30" y="612" width="640" height="180" class="box"/>
  <text x="40" y="632" class="id">NOTES</text>
  <text x="40" y="652" class="sm red">REPRODUCTION DOCUMENT — Not an original L&amp;R Mfg. Co. technical publication. Reverse-engineered</text>
  <text x="40" y="668" class="sm red">from direct physical measurement of specimen S/N 13505. Curated by Hobbs R.E., 2026. Reference only.</text>
  <text x="40" y="690" class="sm">1. AS-FOUND, METER-VERIFIED state (DMM ring-out 2026-06-25). NOT a corrected or grounded design.</text>
  <text x="40" y="706" class="sm">2. HAZARD: original 2-wire, NO earth ground. The neck GREEN wire is a LIVE motor branch, NOT a ground.</text>
  <text x="40" y="722" class="sm">3. No master switch: N2 (hot) is live whenever P1 is plugged. RV1 = motor ON/OFF + speed; S2 = heater.</text>
  <text x="40" y="738" class="sm">4. Plunger S1 = 4-contact transfer switch: d+b jumpered = hot common (bulb taps d); a=white=FWD, c=black=REV.</text>
  <text x="40" y="754" class="sm">   Truth table: OUT closes hot to a (forward); IN closes hot to c (reverse). CONFIRMED by meter.</text>
  <text x="40" y="770" class="sm">5. Lamp DS1 (120V) is PARALLEL with heater R1 (independent pilot). Values: RV1 425, R1 220, DS1 120V/6W.</text>
  <text x="40" y="786" class="sm">6. Next issue: corrected 3-wire grounded rewire target (R-5). Supersedes inferred LR-ELEC-001.</text>

  <!-- ===================== TITLE BLOCK ===================== -->
  <rect x="690" y="612" width="480" height="180" class="box"/>
  <line x1="690" y1="652" x2="1170" y2="652" class="box"/>
  <line x1="930" y1="612" x2="930" y2="792" class="box"/>
  <text x="700" y="638" class="lbl">L&amp;R PRECISION CLEANING MACHINE</text>
  <text x="700" y="674" class="sm">Product Model</text><text x="700" y="692" class="lbl">Master</text>
  <text x="700" y="716" class="sm">Product Serial</text><text x="700" y="734" class="lbl">13505</text>
  <text x="700" y="758" class="sm">Manufacturer</text><text x="700" y="776" class="lbl">L&amp;R MFG. CO.</text>
  <text x="940" y="674" class="sm">Date</text><text x="940" y="692" class="lbl">June 12, 2026</text>
  <text x="940" y="716" class="sm">Engineer</text><text x="940" y="734" class="lbl">Hobbs R.E.</text>
  <text x="940" y="758" class="sm">Drawing / Rev</text><text x="940" y="776" class="lbl">LR-ELEC-002 / Rev A — FIRST ISSUE</text>
</svg>
